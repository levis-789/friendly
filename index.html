<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อพนักงาน Friendly Group</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts (Prompt for Thai) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        primary: '#3b82f6', tagST: '#10b981', tagSL: '#3b82f6', tagCR: '#eab308', tagEnded: '#9ca3af', tagLate: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; transition: background-color 0.3s; }
        .dark body { background-color: #111827; color: #f9fafb; }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 📁 FILE 1: CONFIG & MOCK DATA (ตั้งค่าและข้อมูลจำลอง)
        // ==========================================
        const CLUBS = [
            { id: 'c1', name: 'FRIENDLY CLUB', times: ['00:00', '01:00', '02:00', '03:00', '04:00', '05:00', '06:00', '07:00'] },
            { id: 'c2', name: 'FC CLUB', times: ['23:20', '01:20', '02:20', '03:20', '04:20', '05:20', '06:20'] },
            { id: 'c3', name: 'CF MAN CLUB', times: ['23:40', '01:40', '02:40', '03:40', '04:40', '05:40', '06:40'] },
        ];

        const TAGS = [
            { id: 'ST', label: 'ST', color: 'bg-green-500', type: 'normal' },
            { id: 'SL', label: 'SL', color: 'bg-blue-500', type: 'override' }, // override = เขียนทับทุกช่องเวลา
            { id: 'CR', label: 'CR', color: 'bg-yellow-500', type: 'override' },
            { id: 'ENDED', label: 'จบงาน/พักงาน', color: 'bg-gray-500', type: 'inactive' },
            { id: 'OVERDUE', label: 'พักงานเกินกำหนด', color: 'bg-red-500', type: 'inactive' },
        ];

        // ข้อมูลจำลองสำหรับทดสอบ (ระบบจริงจะดึงจาก Firebase)
        const mockEmployees = [
            { id: 'F601', name: 'พีช', fullName: 'พีรณัฐ', clubId: 'c1', status: 'ST', contractDays: 15, startDate: '2026-07-01' },
            { id: 'F602', name: 'เฟย์', fullName: 'ฟาริดา', clubId: 'c1', status: 'SL', contractDays: 10, startDate: '2026-07-15' },
            { id: 'F603', name: 'ตี้', fullName: 'ธีรเดช', clubId: 'c2', status: 'CR', contractDays: 12, startDate: '2026-07-20' },
            { id: 'F604', name: 'เจแอน', fullName: 'จิราพร', clubId: 'c3', status: 'ENDED', contractDays: 10, startDate: '2026-06-01' },
        ];

        // ==========================================
        // 📁 FILE 2: UTILS (ฟังก์ชันช่วยเหลือ)
        // ==========================================
        const formatThaiDateTime = () => {
            const date = new Date();
            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const dayName = days[date.getDay()];
            const d = date.getDate();
            const m = months[date.getMonth()];
            const y = date.getFullYear() + 543; // ปี พ.ศ.
            const time = date.toLocaleTimeString('th-TH');
            return `วัน ${dayName} ที่ ${d} ${m} ${y} - ${time}`;
        };

        const isEditableByManager = (recordDateStr) => {
            const now = new Date();
            const recordDate = new Date(recordDateStr);
            // ให้เวลาถึง 12:00 ของวันถัดไป
            const cutoff = new Date(recordDate);
            cutoff.setDate(cutoff.getDate() + 1);
            cutoff.setHours(12, 0, 0, 0);
            return now <= cutoff;
        };

        // ==========================================
        // 📁 FILE 3: COMPONENTS - UI Elements
        // ==========================================
        
        // ไอคอน (จำลองการใช้ Lucide React ผ่านฟังก์ชัน)
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                users: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
                layout: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>`,
                check: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>`,
                coffee: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>`,
                dollar: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
                settings: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,
                logOut: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>`,
                sun: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
                moon: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
                download: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`
            };
            return <span dangerouslySetInnerHTML={{ __html: icons[name] }} />;
        };

        // ==========================================
        // 📁 FILE 4: VIEWS - Login & Auth
        // ==========================================
        const LoginScreen = ({ onLogin }) => {
            const [role, setRole] = React.useState('employee'); // 'admin', 'manager', 'employee'
            const [pin, setPin] = React.useState('');
            const [error, setError] = React.useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (role === 'admin' && pin === '000000') {
                    onLogin({ role: 'admin', id: 'ADMIN_01', name: 'ผู้ดูแลระบบสูงสุด' });
                } else if (role === 'manager' && pin.length === 6) {
                    onLogin({ role: 'manager', id: 'MNG_'+pin, name: 'หัวหน้างาน '+pin });
                } else if (role === 'employee' && pin !== '') {
                    onLogin({ role: 'employee', id: pin, name: 'พนักงาน '+pin });
                } else {
                    setError('รหัสผ่านไม่ถูกต้อง');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-900 bg-opacity-95 bg-[url('https://images.unsplash.com/photo-1566417713940-fe7c737a9ef2?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-blend-overlay">
                    <div className="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-gray-700">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-blue-600 dark:text-blue-400 mb-2">Friendly Group</h1>
                            <p className="text-gray-500 dark:text-gray-400">ระบบจัดการและการเช็คชื่อพนักงาน</p>
                        </div>

                        <div className="flex bg-gray-100 dark:bg-gray-700 rounded-lg p-1 mb-6">
                            {['employee', 'manager', 'admin'].map(r => (
                                <button 
                                    key={r}
                                    onClick={() => { setRole(r); setError(''); setPin(''); }}
                                    className={`flex-1 py-2 rounded-md text-sm font-semibold transition-all ${role === r ? 'bg-white dark:bg-gray-600 shadow text-blue-600 dark:text-white' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-600'}`}
                                >
                                    {r === 'admin' ? 'Admin' : r === 'manager' ? 'หัวหน้างาน' : 'พนักงาน'}
                                </button>
                            ))}
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                    {role === 'employee' ? 'รหัสพนักงาน (เช่น F601)' : 'รหัส PIN 6 หลัก'}
                                </label>
                                <input 
                                    type={role === 'employee' ? 'text' : 'password'}
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    maxLength={role === 'employee' ? 10 : 6}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all text-center text-xl tracking-widest font-mono"
                                    placeholder={role === 'employee' ? 'FXXX' : '••••••'}
                                />
                            </div>
                            {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-lg shadow-blue-500/30">
                                เข้าสู่ระบบ
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 📁 FILE 5: VIEWS - Dashboard
        // ==========================================
        const DashboardView = ({ activeClub }) => {
            // จำลองข้อมูล Dashboard
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800 dark:text-white">ภาพรวมระบบ (Real Time) - {activeClub.name}</h2>
                    
                    {/* Stat Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        {[
                            { title: 'พนักงานทั้งหมด', val: '45', color: 'bg-blue-500' },
                            { title: 'มาทำงานวันนี้', val: '38', color: 'bg-green-500' },
                            { title: 'เปอร์เซ็นต์มาทำงาน', val: '84%', color: 'bg-purple-500' },
                            { title: 'ขาดงาน/พักงาน', val: '7', color: 'bg-red-500' },
                        ].map((stat, i) => (
                            <div key={i} className="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center">
                                <p className="text-sm text-gray-500 dark:text-gray-400 mb-1">{stat.title}</p>
                                <h3 className={`text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600 dark:from-white dark:to-gray-300`}>
                                    {stat.val}
                                </h3>
                                <div className={`h-1 w-1/2 mt-3 rounded-full ${stat.color}`}></div>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Task List / Rankings */}
                        <div className="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                            <h3 className="font-bold text-lg mb-4 text-gray-800 dark:text-white">จัดอันดับพนักงาน (Task List)</h3>
                            <div className="space-y-3">
                                {['พีช (F601) - 15 ดื่ม', 'เฟย์ (F602) - 12 ดื่ม', 'ตี้ (F603) - 8 ดื่ม'].map((p, i) => (
                                    <div key={i} className="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-blue-600 dark:text-blue-300 font-bold">
                                                {i+1}
                                            </div>
                                            <span className="text-gray-700 dark:text-gray-200">{p}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Status Overview */}
                        <div className="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                            <h3 className="font-bold text-lg mb-4 text-gray-800 dark:text-white">สัดส่วนสถานะ (ST/CR/SL)</h3>
                            <div className="space-y-4">
                                {['ST (เริ่มงาน) - 20 คน', 'CR (เชียร์แขก) - 10 คน', 'SL (ไซด์ไลน์) - 8 คน'].map((s, i) => {
                                    const colors = ['bg-green-500', 'bg-yellow-500', 'bg-blue-500'];
                                    const widths = ['w-[60%]', 'w-[30%]', 'w-[20%]'];
                                    return (
                                        <div key={i}>
                                            <div className="flex justify-between text-sm text-gray-600 dark:text-gray-400 mb-1">
                                                <span>{s}</span>
                                            </div>
                                            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                                                <div className={`${colors[i]} h-2 rounded-full ${widths[i]}`}></div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 📁 FILE 6: VIEWS - Attendance (ระบบเช็คชื่ออัจฉริยะ)
        // ==========================================
        const AttendanceView = ({ user, activeClub, selectedDate }) => {
            // ข้อมูลจำลองการเช็คชื่อ
            const [attendanceData, setAttendanceData] = React.useState({});
            const [selectedCell, setSelectedCell] = React.useState(null); // สำหรับ Modal ใส่หมายเหตุ
            const isEditable = user.role === 'admin' || (user.role === 'manager' && isEditableByManager(selectedDate));

            // กรองพนักงานเฉพาะคลับนี้ และสถานะยังทำงานอยู่
            const clubEmployees = mockEmployees.filter(e => e.clubId === activeClub.id && e.status !== 'ENDED');

            // ฟังก์ชันเปลี่ยน Tag
            const handleTagChange = (empId, newTagId) => {
                if(!isEditable) return;
                
                const newTag = TAGS.find(t => t.id === newTagId);
                const currentData = attendanceData[empId] || { times: {}, note: '' };
                const newTimes = { ...currentData.times };

                // กฎธุรกิจ: ถ้าเป็น CR หรือ SL ให้เติมทุกช่องอัตโนมัติ
                if (newTag && newTag.type === 'override') {
                    activeClub.times.forEach(time => {
                        newTimes[time] = { mark: newTag.id, note: '' };
                    });
                }

                setAttendanceData({
                    ...attendanceData,
                    [empId]: { ...currentData, tag: newTagId, times: newTimes }
                });
            };

            // ฟังก์ชันคลิกที่ช่องเวลา (เปิด Modal)
            const handleCellClick = (empId, time) => {
                if(!isEditable) return;
                const record = attendanceData[empId]?.times[time] || { mark: '', note: '' };
                setSelectedCell({ empId, time, mark: record.mark, note: record.note });
            };

            // บันทึกเซลล์
            const saveCell = (mark, note) => {
                const { empId, time } = selectedCell;
                const currentData = attendanceData[empId] || { times: {}, note: '' };
                
                setAttendanceData({
                    ...attendanceData,
                    [empId]: {
                        ...currentData,
                        times: {
                            ...currentData.times,
                            [time]: { mark, note }
                        }
                    }
                });
                setSelectedCell(null);
            };

            return (
                <div className="flex flex-col h-full space-y-4">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-bold text-gray-800 dark:text-white">ตารางเช็คชื่อ - {activeClub.name}</h2>
                        {!isEditable && user.role !== 'employee' && (
                            <span className="bg-red-100 text-red-600 px-3 py-1 rounded-full text-sm font-bold">หมดเวลาแก้ไขย้อนหลัง</span>
                        )}
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden flex-1">
                        <div className="overflow-x-auto h-full">
                            <table className="w-full text-sm text-left whitespace-nowrap">
                                <thead className="bg-gray-50 dark:bg-gray-900 text-gray-700 dark:text-gray-300 sticky top-0 z-10">
                                    <tr>
                                        <th className="p-3 border-b dark:border-gray-700 w-16 text-center sticky left-0 bg-gray-50 dark:bg-gray-900">No.</th>
                                        <th className="p-3 border-b dark:border-gray-700 w-24 text-center sticky left-[64px] bg-gray-50 dark:bg-gray-900">Tag</th>
                                        <th className="p-3 border-b dark:border-gray-700 min-w-[150px] sticky left-[160px] bg-gray-50 dark:bg-gray-900">ชื่อพนักงาน</th>
                                        {activeClub.times.map((t, i) => (
                                            <th key={i} className="p-3 border-b border-l dark:border-gray-700 text-center font-mono">{t}</th>
                                        ))}
                                        <th className="p-3 border-b border-l dark:border-gray-700 min-w-[200px]">หมายเหตุประจำวัน</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {clubEmployees.map((emp) => {
                                        const record = attendanceData[emp.id] || { tag: emp.status, times: {}, dailyNote: '' };
                                        const currentTagObj = TAGS.find(t => t.id === record.tag) || TAGS[0];

                                        return (
                                            <tr key={emp.id} className="border-b dark:border-gray-700 hover:bg-blue-50 dark:hover:bg-gray-750 transition-colors">
                                                <td className="p-2 text-center font-mono text-gray-500 sticky left-0 bg-white dark:bg-gray-800">{emp.id}</td>
                                                
                                                {/* คอลัมน์ TAG (เปลี่ยนสีและคลิกได้) */}
                                                <td className="p-2 text-center sticky left-[64px] bg-white dark:bg-gray-800">
                                                    {isEditable ? (
                                                        <select 
                                                            value={record.tag}
                                                            onChange={(e) => handleTagChange(emp.id, e.target.value)}
                                                            className={`text-xs font-bold px-2 py-1 rounded cursor-pointer border-none outline-none appearance-none text-white text-center w-full ${currentTagObj.color}`}
                                                        >
                                                            {TAGS.map(t => <option key={t.id} value={t.id} className="bg-gray-800 text-white">{t.label}</option>)}
                                                        </select>
                                                    ) : (
                                                        <span className={`text-xs font-bold px-2 py-1 rounded text-white inline-block w-full ${currentTagObj.color}`}>{currentTagObj.label}</span>
                                                    )}
                                                </td>
                                                
                                                <td className="p-3 font-bold text-gray-900 dark:text-white sticky left-[160px] bg-white dark:bg-gray-800">
                                                    {emp.name} <span className="text-xs text-gray-400 font-normal">({emp.fullName})</span>
                                                </td>

                                                {/* คอลัมน์เวลา */}
                                                {activeClub.times.map((time) => {
                                                    const cellData = record.times[time] || { mark: '', note: '' };
                                                    const hasNote = cellData.note && cellData.note.trim() !== '';
                                                    
                                                    // กำหนดสีป้าย (Badge)
                                                    let badgeColor = 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-200';
                                                    if(cellData.mark === '/') badgeColor = 'bg-green-100 text-green-700 border border-green-300';
                                                    if(cellData.mark === 'X') badgeColor = 'bg-red-100 text-red-700 border border-red-300';
                                                    if(cellData.mark === 'SL') badgeColor = 'bg-blue-100 text-blue-700 border border-blue-300';
                                                    if(cellData.mark === 'CR') badgeColor = 'bg-yellow-100 text-yellow-700 border border-yellow-300';

                                                    return (
                                                        <td 
                                                            key={time} 
                                                            onClick={() => handleCellClick(emp.id, time)}
                                                            className={`p-1 border-l dark:border-gray-700 text-center relative ${isEditable ? 'cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600' : ''}`}
                                                        >
                                                            <div className="h-10 flex items-center justify-center">
                                                                {cellData.mark && (
                                                                    <span className={`px-2 py-1 rounded text-sm font-bold shadow-sm ${badgeColor}`}>
                                                                        {cellData.mark}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {/* จุดแจ้งเตือนหมายเหตุ */}
                                                            {hasNote && <div className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>}
                                                        </td>
                                                    );
                                                })}
                                                <td className="p-2 border-l dark:border-gray-700">
                                                    <input 
                                                        type="text" 
                                                        disabled={!isEditable}
                                                        placeholder="เพิ่มหมายเหตุประจำวัน..."
                                                        className="w-full bg-transparent border-none outline-none text-sm text-gray-600 dark:text-gray-400 focus:ring-1 focus:ring-blue-500 rounded px-2 py-1"
                                                    />
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Modal แก้ไขเซลล์ (ซ่อนหมายเหตุไว้) */}
                    {selectedCell && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-gray-200 dark:border-gray-700 transform transition-all">
                                <div className="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900">
                                    <h3 className="font-bold text-gray-800 dark:text-white">ระบุการเช็คชื่อเวลา {selectedCell.time}</h3>
                                    <button onClick={() => setSelectedCell(null)} className="text-gray-500 hover:text-red-500">ปิด</button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="grid grid-cols-4 gap-2">
                                        {['/', 'X', 'ล/ส', 'กต'].map(m => (
                                            <button 
                                                key={m}
                                                onClick={() => saveCell(m, selectedCell.note)}
                                                className={`py-3 rounded-lg font-bold border transition-colors ${selectedCell.mark === m ? 'bg-blue-600 text-white border-blue-600' : 'bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-600 hover:bg-gray-100'}`}
                                            >
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-600 dark:text-gray-400 mb-1 font-medium">หมายเหตุ (ซ่อนไว้)</label>
                                        <textarea 
                                            value={selectedCell.note}
                                            onChange={(e) => setSelectedCell({...selectedCell, note: e.target.value})}
                                            placeholder="เช่น แต่งหน้าทำผม, ลาสาย (จะแสดงจุดแดงแจ้งเตือนในตาราง)"
                                            className="w-full border dark:border-gray-600 rounded-lg p-3 h-24 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => saveCell('', '')} className="flex-1 py-2 bg-red-100 text-red-600 rounded-lg font-bold hover:bg-red-200">ล้างข้อมูล</button>
                                        <button onClick={() => saveCell(selectedCell.mark, selectedCell.note)} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">บันทึก</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 📁 FILE 7: EXPORT MODULE (ส่งออก Google Sheets)
        // ==========================================
        const exportToCSV = (date, club) => {
            // สร้าง CSV Header
            let csv = "data:text/csv;charset=utf-8,\uFEFF"; // \uFEFF for Thai UTF-8 BOM
            csv += `ระบบเช็คชื่อ,วันที่:,${date},คลับ:,${club.name}\n\n`;
            csv += `No.,Tag,ชื่อพนักงาน,${club.times.join(',')},หมายเหตุ\n`;
            
            // ข้อมูล (จำลอง)
            mockEmployees.forEach(emp => {
                if(emp.clubId === club.id) {
                    let row = `${emp.id},${emp.status},${emp.name}`;
                    club.times.forEach(() => row += `,-`); // ข้อมูลจำลองช่องว่าง
                    row += `,ไม่มีหมายเหตุ\n`;
                    csv += row;
                }
            });

            // ดาวน์โหลด
            const encodedUri = encodeURI(csv);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `เช็คชื่อ_${club.name}_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert("ส่งออกไฟล์ CSV สำเร็จ!\nคุณสามารถนำไฟล์นี้ไป นำเข้า (Import) ใน Google Sheets ได้ทันที");
        };

        // ==========================================
        // 📁 FILE 8: MAIN APP (หน้าหลัก ควบคุมการนำทาง)
        // ==========================================
        const App = () => {
            const [user, setUser] = React.useState(null); // null = ยังไม่ล็อคอิน
            const [darkMode, setDarkMode] = React.useState(false);
            const [currentMenu, setCurrentMenu] = React.useState('dashboard');
            const [activeClubId, setActiveClubId] = React.useState(CLUBS[0].id);
            const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [currentTime, setCurrentTime] = React.useState(formatThaiDateTime());

            // อัปเดตเวลาแบบ Realtime
            React.useEffect(() => {
                const timer = setInterval(() => setCurrentTime(formatThaiDateTime()), 1000);
                return () => clearInterval(timer);
            }, []);

            // จัดการ Dark Mode
            React.useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            if (!user) {
                return <LoginScreen onLogin={setUser} />;
            }

            // เมนูตามสิทธิ์
            const menus = [
                { id: 'dashboard', label: 'Dashboard ภาพรวม', icon: 'layout', roles: ['admin', 'manager'] },
                { id: 'attendance', label: 'ตารางเช็คชื่อ', icon: 'check', roles: ['admin', 'manager', 'employee'] },
                { id: 'drinks', label: 'ระบบจดดื่ม', icon: 'coffee', roles: ['admin', 'manager'] },
                { id: 'finance', label: 'ระบบการเงิน', icon: 'dollar', roles: ['admin'] },
                { id: 'employees', label: 'จัดการพนักงาน', icon: 'users', roles: ['admin'] },
                { id: 'settings', label: 'ตั้งค่าระบบ', icon: 'settings', roles: ['admin'] },
            ].filter(m => m.roles.includes(user.role));

            // บังคับสิทธิ์ พนักงานดูได้แค่หน้าเช็คชื่อ
            if (user.role === 'employee' && currentMenu !== 'attendance') {
                setCurrentMenu('attendance');
            }

            const activeClub = CLUBS.find(c => c.id === activeClubId);

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
                    
                    {/* Sidebar */}
                    <aside className="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col shadow-lg z-20 hidden md:flex">
                        <div className="p-6 border-b dark:border-gray-700">
                            <h1 className="text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">Friendly Group</h1>
                            <div className="mt-2 text-sm text-gray-500 dark:text-gray-400 flex items-center gap-2">
                                <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                {user.name} ({user.role})
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {menus.map(m => (
                                <button
                                    key={m.id}
                                    onClick={() => setCurrentMenu(m.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${currentMenu === m.id ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 dark:text-gray-400 hover:bg-blue-50 dark:hover:bg-gray-700 hover:text-blue-600 dark:hover:text-white'}`}
                                >
                                    <Icon name={m.icon} size={20} />
                                    <span className="font-medium">{m.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t dark:border-gray-700">
                            <button onClick={() => setUser(null)} className="w-full flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-colors font-bold">
                                <Icon name="logOut" size={20} />
                                ออกจากระบบ
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {/* Topbar */}
                        <header className="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
                            <div className="flex items-center gap-4">
                                {/* Club Tabs */}
                                <div className="flex bg-gray-100 dark:bg-gray-700 rounded-lg p-1 overflow-x-auto no-scrollbar max-w-full">
                                    {CLUBS.map(club => (
                                        <button
                                            key={club.id}
                                            onClick={() => setActiveClubId(club.id)}
                                            className={`px-4 py-1.5 rounded-md whitespace-nowrap text-sm font-bold transition-colors ${
                                                activeClubId === club.id ? 'bg-white dark:bg-gray-600 shadow-sm text-blue-600 dark:text-white' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-500'
                                            }`}
                                        >
                                            {club.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden lg:block text-sm font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-full border dark:border-gray-600">
                                    🕒 {currentTime}
                                </div>
                                <input 
                                    type="date" 
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    className="bg-gray-100 dark:bg-gray-700 border dark:border-gray-600 text-gray-800 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block px-3 py-1.5 outline-none font-mono"
                                />
                                {['admin', 'manager'].includes(user.role) && (
                                    <button onClick={() => exportToCSV(selectedDate, activeClub)} className="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm transition-colors">
                                        <Icon name="download" size={16} /> <span className="hidden sm:inline">ส่งออก Sheets</span>
                                    </button>
                                )}
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">
                                    <Icon name={darkMode ? "sun" : "moon"} size={20} />
                                </button>
                            </div>
                        </header>

                        {/* Page Content View */}
                        <div className="flex-1 overflow-auto p-4 md:p-6 bg-gray-50 dark:bg-gray-900">
                            {currentMenu === 'dashboard' && <DashboardView activeClub={activeClub} />}
                            {currentMenu === 'attendance' && <AttendanceView user={user} activeClub={activeClub} selectedDate={selectedDate} />}
                            {currentMenu === 'drinks' && <div className="p-8 text-center text-gray-500">ส่วนระบบจดดื่ม (กำลังพัฒนา)</div>}
                            {currentMenu === 'finance' && <div className="p-8 text-center text-gray-500">ส่วนระบบการเงิน สำหรับ Admin เท่านั้น</div>}
                            {currentMenu === 'employees' && <div className="p-8 text-center text-gray-500">ส่วนจัดการรายชื่อและสัญญางานพนักงาน</div>}
                            {currentMenu === 'settings' && <div className="p-8 text-center text-gray-500">ส่วนตั้งค่าระบบ เพิ่มคลับ เพิ่มสัญลักษณ์ เพิ่มหัวหน้างาน</div>}
                        </div>

                        {/* Footer */}
                        <footer className="shrink-0 p-3 text-center text-xs text-gray-400 dark:text-gray-600 border-t border-gray-200 dark:border-gray-800">
                            Copyright © 2026 Friendly Group. Designed || Version 1
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
